name: FlowMD CI / Deploy

on:
  push:
    branches: [main]
    # The deploy job's version-bump commit only touches these files; ignoring
    # them on push keeps the bump from re-triggering this workflow's test job.
    paths-ignore:
      - index.html
      - sw.js
      - js/core/constants.js
  pull_request:
  workflow_dispatch:

# Serialize pipeline runs per ref. Two PRs merging back-to-back used to run
# their deploy jobs concurrently and race the version-bump push — the loser
# failed with "! [rejected] main -> main (fetch first)". Queuing (rather than
# cancel-in-progress) keeps a deploy from ever being killed mid-bump. PR runs
# get their own group per PR, so they never queue behind pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on every push to main and on every pull request. Never deploys.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      # Smoke + onboarding cover the live UI; backup covers export/import;
      # landing-smoke covers the marketing landing page; the unit glob runs
      # the FULL sync/store/quest suite (two-device harness, zero-write
      # settles, queue engine).
      - name: Run tests
        run: node tests/smoke.mjs && node tests/onboarding.mjs && node tests/backup.mjs && node tests/landing-smoke.mjs && node --test tests/unit/*.test.mjs

  # Auto-deploy gate: runs on every push to main (i.e. every PR merge) and on
  # manual "Run workflow" from the Actions tab. Never runs for pull_request
  # events, so a PR alone never deploys to the live site.
  deploy:
    needs: test
    # Docs-only pushes skip the Firebase deploy: the worklog auto-logger
    # (worklog.yml) appends "[skip-deploy]" to its commit message when the
    # merged PR touched no app-shell files, and this condition honors it.
    if: >
      github.event_name != 'pull_request' &&
      !endsWith(github.event.head_commit.message, '[skip-deploy]')
    # The version-bump step pushes back to main; the default GITHUB_TOKEN is
    # read-only, so it needs contents: write or the push fails with a 403.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOTE: Workload Identity Federation (Task B4) was deferred by the user —
      # it requires one-time Google Cloud console setup (service account, WIF
      # pool/provider, PROJECT_NUMBER). Until then, deploy auth stays on the
      # existing FIREBASE_TOKEN secret, which already works. To migrate later,
      # replace the deploy step's token with the google-github-actions/auth@v2
      # OIDC step (see the hardening branch history / CONCERNS.md #8).
      - name: Bump cache version & commit back to main
        run: |
          echo "::notice::Workflow file from commit $(git rev-parse HEAD) (run on ${{ github.ref_name }})"
          # Self-diagnose: confirm the GITHUB_TOKEN can actually push before
          # committing. If push is false here, the run is using a stale
          # workflow file or the repo default is overriding job permissions.
          PERMS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}" | \
            grep -oE '"push": ?(true|false)' || echo '"push": "unknown"')
          echo "::notice::GITHUB_TOKEN $PERMS"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # This run's checkout may be behind main by the time the job starts
          # (back-to-back merges). Re-sync to the true latest main BEFORE
          # bumping so the version is computed from it, always moves forward,
          # and the push fast-forwards. The workflow-level concurrency group
          # guarantees no other deploy runs between this fetch and the push.
          git fetch origin main
          git reset --hard origin/main
          node scripts/bump-version.js
          git add index.html sw.js js/core/constants.js
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: bump cache version"
            git push
          fi

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}"
